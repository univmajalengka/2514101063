<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101820">
<title>Explore Majalengka | Curug Muara Jaya</title>

<style>
:root{
    --navy:#101820;
    --navy-light:#192631;
    --navy-card:#202F3B;
    --white:#FFFFFF;
    --soft-white:#F4F6F8;
    --gray:#D6DCE2;
    --muted:#AEB9C4;
    --green:#00A878;
    --blue:#2693C4;
    --border:rgba(255,255,255,.13);
    --shadow:0 18px 45px rgba(0,0,0,.18);
    --radius:22px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    scroll-padding-top:90px;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--navy);
    color:var(--white);
    line-height:1.7;
}

a{
    color:inherit;
    text-decoration:none;
}

img{
    display:block;
    max-width:100%;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1160px,92%);
    margin:auto;
}

.section{
    padding:85px 0;
}

.light-section{
    background:var(--soft-white);
    color:#17212B;
}

.dark-section{
    background:var(--navy);
    color:#fff;
}

.section-heading{
    max-width:720px;
    margin-bottom:38px;
}

.section-heading.center{
    text-align:center;
    margin-left:auto;
    margin-right:auto;
}

.eyebrow{
    display:inline-block;
    padding:6px 13px;
    margin-bottom:15px;
    background:rgba(0,168,120,.16);
    border:1px solid rgba(0,168,120,.5);
    border-radius:30px;
    color:#008D65;
    font-size:12px;
    font-weight:bold;
    letter-spacing:1.3px;
    text-transform:uppercase;
}

.dark-section .eyebrow,
.hero .eyebrow,
.destination-banner .eyebrow,
.ticket-hero .eyebrow,
.video-hero .eyebrow{
    color:#D8FFF2;
}

.section-heading h2{
    font-size:clamp(29px,4vw,43px);
    line-height:1.2;
    margin-bottom:14px;
    letter-spacing:-.8px;
}

.section-heading p{
    color:#5B6570;
    font-size:15px;
}

.dark-section .section-heading p{
    color:var(--gray);
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 21px;
    border:1px solid transparent;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-3px);
}

.btn-primary{
    background:var(--green);
    color:white;
    box-shadow:0 8px 22px rgba(0,168,120,.2);
}

.btn-primary:hover{
    background:#008D65;
}

.btn-outline{
    color:white;
    border-color:rgba(255,255,255,.5);
    background:rgba(255,255,255,.05);
}

.btn-outline:hover{
    background:white;
    color:var(--navy);
}

.btn-dark{
    background:var(--navy);
    color:white;
}

.btn-dark:hover{
    background:#263B4A;
}

/* NAVIGASI */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(16,24,32,.97);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
}

.navbar{
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
}

.brand-icon{
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    border-radius:14px;
    background:linear-gradient(135deg,var(--green),var(--blue));
    font-size:24px;
}

.brand-name{
    font-size:15px;
    font-weight:800;
    line-height:1.3;
}

.brand-name small{
    display:block;
    color:var(--muted);
    font-size:9px;
    letter-spacing:1.5px;
    margin-top:4px;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:4px;
    list-style:none;
}

.nav-link{
    display:block;
    padding:10px 12px;
    color:#E2E7EC;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    transition:.2s;
}

.nav-link:hover,
.nav-link.active{
    color:white;
    background:#263744;
}

.nav-cta{
    padding:10px 15px;
    background:var(--green);
    color:white;
    border-radius:10px;
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
}

.menu-toggle{
    display:none;
    width:43px;
    height:43px;
    border:1px solid var(--border);
    border-radius:10px;
    color:white;
    background:var(--navy-light);
    font-size:23px;
}

/* SISTEM ENAM HALAMAN */

.page{
    display:none;
    animation:pageFade .35s ease;
}

.page.active{
    display:block;
}

@keyframes pageFade{
    from{opacity:0;transform:translateY(8px)}
    to{opacity:1;transform:translateY(0)}
}

/* HOME */

.hero{
    min-height:680px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    background:
        linear-gradient(90deg,rgba(7,15,22,.96),rgba(7,15,22,.72),rgba(7,15,22,.2)),
        linear-gradient(0deg,rgba(16,24,32,.85),transparent 55%),
        url("https://lh3.googleusercontent.com/d/FILE_ID_1") center/cover no-repeat;
}

.hero-content{
    max-width:760px;
    padding:100px 0 130px;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:9px 15px;
    margin-bottom:25px;
    background:rgba(0,168,120,.17);
    border:1px solid rgba(0,214,154,.5);
    border-radius:30px;
    font-size:11px;
    font-weight:800;
    color:#D8FFF2;
    letter-spacing:1.5px;
}

.hero-label span{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#00D69A;
}

.hero h1{
    max-width:760px;
    font-size:clamp(43px,7.3vw,80px);
    line-height:1.04;
    letter-spacing:-2.5px;
    margin-bottom:24px;
}

.hero h1 em{
    color:#71E5BF;
    font-style:normal;
}

.hero p{
    max-width:570px;
    font-size:16px;
    line-height:1.9;
    margin-bottom:30px;
    color:#E0E7EC;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:13px;
}

.hero-stats{
    display:flex;
    flex-wrap:wrap;
    gap:0;
    margin-top:45px;
    padding-top:23px;
    border-top:1px solid rgba(255,255,255,.2);
    max-width:590px;
}

.stat{
    min-width:145px;
    padding:0 22px;
    border-right:1px solid rgba(255,255,255,.2);
}

.stat:first-child{
    padding-left:0;
}

.stat:last-child{
    border-right:0;
}

.stat strong{
    display:block;
    font-size:22px;
    line-height:1.3;
}

.stat span{
    display:block;
    color:#C5D0D8;
    font-size:11px;
    margin-top:5px;
}

.hero-floating-card{
    position:absolute;
    right:5%;
    bottom:35px;
    width:270px;
    padding:16px;
    display:flex;
    align-items:center;
    gap:13px;
    background:rgba(16,24,32,.82);
    border:1px solid rgba(255,255,255,.24);
    border-radius:18px;
    backdrop-filter:blur(12px);
}

.hero-floating-icon{
    display:grid;
    place-items:center;
    flex-shrink:0;
    width:48px;
    height:48px;
    border-radius:14px;
    background:linear-gradient(135deg,var(--green),var(--blue));
    font-size:24px;
}

.hero-floating-card strong{
    display:block;
    font-size:13px;
}

.hero-floating-card span{
    display:block;
    color:#C7D2DA;
    font-size:11px;
    line-height:1.5;
}

.intro-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    gap:55px;
}

.intro-image{
    position:relative;
}

.intro-image img{
    width:100%;
    height:470px;
    object-fit:cover;
    border-radius:28px 28px 90px 28px;
    box-shadow:var(--shadow);
}

.image-note{
    position:absolute;
    left:18px;
    right:18px;
    bottom:18px;
    padding:16px;
    background:rgba(16,24,32,.9);
    border:1px solid rgba(255,255,255,.2);
    border-radius:15px;
    color:white;
}

.image-note strong{
    display:block;
}

.image-note span{
    font-size:12px;
    color:#D6DCE2;
}

.intro-copy h2{
    font-size:clamp(30px,4vw,43px);
    line-height:1.2;
    margin-bottom:18px;
}

.intro-copy p{
    color:#59646E;
    margin-bottom:16px;
}

.feature-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:24px;
}

.feature-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    border:1px solid #E0E7EB;
    background:white;
    border-radius:13px;
    font-size:13px;
    font-weight:bold;
}

.feature-icon{
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    flex-shrink:0;
    border-radius:11px;
    background:#DDF8EC;
    font-size:19px;
}

.home-quicklinks{
    background:#E9EEF2;
    color:#17212B;
}

.destination-tips{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.tip-card{
    background:white;
    border:1px solid #DCE5E9;
    border-radius:18px;
    padding:25px;
    box-shadow:0 12px 28px rgba(4,20,30,.07);
    transition:.25s;
}

.tip-card:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow);
}

.tip-icon{
    width:55px;
    height:55px;
    display:grid;
    place-items:center;
    border-radius:16px;
    background:#DDF8EC;
    font-size:27px;
    margin-bottom:17px;
}

.tip-card h3{
    font-size:18px;
    margin-bottom:9px;
}

.tip-card p{
    font-size:14px;
    color:#5B6570;
    margin-bottom:17px;
}

.home-cta{
    padding:65px 0;
    text-align:center;
    background:
        linear-gradient(100deg,rgba(7,15,22,.92),rgba(7,15,22,.75)),
        url("https://lh3.googleusercontent.com/d/FILE_ID_3") center/cover no-repeat;
}

.home-cta h2{
    font-size:clamp(28px,4vw,42px);
    margin-bottom:12px;
}

.home-cta p{
    color:#D6DCE2;
    margin-bottom:24px;
}

/* BANNER HALAMAN */

.destination-banner,
.ticket-hero,
.video-hero{
    padding:95px 0;
    background:
        linear-gradient(90deg,rgba(7,15,22,.94),rgba(7,15,22,.68)),
        url("https://lh3.googleusercontent.com/d/FILE_ID_2") center/cover no-repeat;
}

.destination-banner h1,
.ticket-hero h1,
.video-hero h1{
    font-size:clamp(36px,6vw,60px);
    line-height:1.15;
    margin-bottom:15px;
}

.destination-banner p,
.ticket-hero p,
.video-hero p{
    max-width:680px;
    color:#D6DCE2;
}

/* DESTINASI */

.destination-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:45px;
    align-items:center;
}

.destination-image img{
    width:100%;
    height:450px;
